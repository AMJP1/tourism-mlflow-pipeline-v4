
name: Tourism Project Pipeline

concurrency:
  group: tourism-pipeline-main
  cancel-in-progress: false

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tourism_project/requirements.txt

      - name: Register Dataset
        run: python tourism_project/model_building/data_register.py

  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tourism_project/requirements.txt

      - name: Run Data Preparation
        run: python tourism_project/model_building/prep.py

      - name: Upload Train Test Splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            Xtrain.csv
            Xtest.csv
            ytrain.csv
            ytest.csv
          if-no-files-found: error

  model-training:
    needs: data-prep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tourism_project/requirements.txt

      - name: Download Train Test Splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits
          path: .

      - name: Train Model
        run: python tourism_project/model_building/train.py

      - name: Verify Model File
        run: |
          test -f tourism_project/deployment/best_pred_model_v1.joblib
          ls -lh tourism_project/deployment/best_pred_model_v1.joblib

      - name: Commit Trained Model
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          MODEL_FILE="tourism_project/deployment/best_pred_model_v1.joblib"

          test -f "$MODEL_FILE"
          git add "$MODEL_FILE"

          if git diff --cached --quiet; then
            echo "No model changes to commit."
            exit 0
          fi

          git commit -m "Update trained tourism model [skip ci]"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt"

            git fetch origin main

            if ! git rebase origin/main; then
              echo "Rebase conflict detected. Stopping safely."
              git rebase --abort
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Model successfully pushed."
              exit 0
            fi

            echo "Push rejected. Retrying..."
            sleep 2
          done

          echo "Failed to push after 3 attempts."
          exit 1
